<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omar ATS - نظام تحليل التوظيف</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- File Parsing Libraries -->
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- Mammoth.js for DOCX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            overflow-x: hidden;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .animate-fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-slide-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 1.5s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        /* Custom File Upload */
        .file-drop-zone {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='24' ry='24' stroke='%23CBD5E1FF' stroke-width='2' stroke-dasharray='12%2c 12' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
            transition: all 0.3s ease;
        }
        .file-drop-zone:hover {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='24' ry='24' stroke='%236366F1FF' stroke-width='3' stroke-dasharray='12%2c 12' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
            background-color: #EEF2FF;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>

    <!-- React and Lucide Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Shared Icons ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (window.lucide && containerRef.current) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({ root: containerRef.current });
                    const svg = containerRef.current.querySelector('svg');
                    if (svg) {
                        svg.setAttribute('width', size);
                        svg.setAttribute('height', size);
                        if (className) className.split(' ').filter(Boolean).forEach(cls => svg.classList.add(cls));
                    }
                }
            }, [name, size, className]);
            return <span ref={containerRef} className="inline-flex items-center justify-center pointer-events-none" style={{ width: size, height: size }}></span>;
        };

        // --- Logic Engine (Real Parsers) ---
        
        // 1. Extract Text from Files
        const extractTextFromFile = async (file) => {
            try {
                if (file.type === "text/plain") {
                    return await file.text();
                } else if (file.type === "application/pdf") {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += textContent.items.map(item => item.str).join(" ") + " ";
                    }
                    return fullText;
                } else if (file.type === "application/vnd.openxmlformats-officedocument.wordprocessingml.document") {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                    return result.value;
                } else {
                    return ""; // Unsupported format fallback
                }
            } catch (error) {
                console.error("Error parsing file:", error);
                return "";
            }
        };

        // 3. Keyword Matching & Scoring
        const extractKeywords = (text) => {
            if (!text) return [];
            // Remove common stop words and small words
            const stopWords = ['the', 'and', 'for', 'with', 'from', 'that', 'this', 'experience', 'work', 'skills', 'education', 'في', 'من', 'على', 'مع', 'العمل', 'خبرة', 'required', 'requirements', 'about', 'summary'];
            const words = text.toLowerCase().replace(/[^\w\s\u0600-\u06FF]/g, '').split(/\s+/);
            // Return unique words longer than 3 chars that aren't stop words
            return [...new Set(words.filter(w => w.length > 3 && !stopWords.includes(w)))];
        };

        const analyzeCV = (cvText, jobDesc) => {
            const jdKeywords = extractKeywords(jobDesc);
            const cvTextLower = cvText.toLowerCase();
            
            // Find Matches
            const foundKeywords = jdKeywords.filter(keyword => cvTextLower.includes(keyword));
            const missingKeywords = jdKeywords.filter(keyword => !cvTextLower.includes(keyword));
            
            // Calculate Score (Based purely on Job Description Match)
            // 80% weight on keywords match
            // 20% weight on basic structure (contact info presence)
            
            const keywordRatio = jdKeywords.length > 0 ? (foundKeywords.length / jdKeywords.length) : 0;
            
            // Structural checks (reduced weight, just to ensure it's a valid-looking CV)
            const hasEmail = /([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/.test(cvText);
            const hasPhone = /(\+?\d{8,})/.test(cvText);
            const structureScore = (hasEmail ? 5 : 0) + (hasPhone ? 5 : 0) + (cvText.length > 500 ? 10 : 0); // Max 20 points
            
            let finalScore = Math.round((keywordRatio * 80) + structureScore);
            finalScore = Math.min(100, Math.max(10, finalScore)); // Clamp between 10 and 100

            // Generate Summary based on actual data
            let summary = "";
            if (finalScore > 85) {
                summary = `المرشح ممتاز! يمتلك تطابقاً قوياً جداً مع الوصف الوظيفي (${foundKeywords.length} من ${jdKeywords.length} كلمة مفتاحية). ينصح به بشدة.`;
            } else if (finalScore > 60) {
                summary = `المرشح جيد. يمتلك المهارات الأساسية ولكنه يفتقد بعض الكلمات المهمة مثل: ${missingKeywords.slice(0, 3).join(', ')}. يستحق المراجعة.`;
            } else {
                summary = `تطابق ضعيف مع الوصف الوظيفي. السيرة الذاتية تفتقر للعديد من المهارات المطلوبة.`;
            }

            return {
                score: finalScore,
                foundKeywords,
                missingKeywords,
                aiSummary: summary,
                email: cvText.match(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/)?.[0] || "غير موجود",
                phone: cvText.match(/(\+?\d{9,})?.[0-9]{9,}/)?.[0] || "غير موجود"
            };
        };


        // --- UI Components ---

        const SkillBar = ({ label, value, colorClass }) => (
            <div className="mb-3">
                <div className="flex justify-between mb-1">
                    <span className="text-xs font-bold text-slate-700">{label}</span>
                    <span className="text-xs font-bold text-slate-500">{value}%</span>
                </div>
                <div className="w-full bg-slate-100 rounded-full h-2">
                    <div className={`h-2 rounded-full transition-all duration-1000 ${colorClass}`} style={{ width: `${value}%` }}></div>
                </div>
            </div>
        );

        const DashboardHome = ({ setView }) => {
            return (
                <div className="max-w-6xl mx-auto pt-10 px-4 animate-slide-up min-h-[80vh] flex flex-col justify-center">
                    <div className="text-center mb-16">
                        <div className="inline-flex items-center justify-center p-4 bg-white rounded-3xl shadow-xl mb-6 relative">
                            <div className="absolute inset-0 bg-gradient-to-tr from-indigo-500 to-violet-500 rounded-3xl blur-xl opacity-20"></div>
                            <Icon name="aperture" size={48} className="text-indigo-600 relative z-10" />
                        </div>
                        <h1 className="text-5xl font-black text-slate-800 tracking-tight mb-4">Omar ATS <span className="text-indigo-600">Smart Engine</span></h1>
                        <p className="text-slate-500 font-bold text-lg max-w-2xl mx-auto">نظام تحليل حقيقي يقرأ محتوى الملفات ويطابقها مع الوصف الوظيفي بدقة.</p>
                    </div>

                    <div className="max-w-xl mx-auto w-full">
                        <button 
                            onClick={() => setView('scanner')}
                            className={`w-full group glass-card p-10 rounded-[40px] text-right transition-all duration-300 hover:-translate-y-2 hover:shadow-indigo-500/30 border border-white/50 flex flex-col items-center text-center`}
                        >
                            <div className={`bg-indigo-600 w-24 h-24 rounded-full flex items-center justify-center text-white shadow-xl group-hover:scale-110 transition-transform duration-500 mb-6`}>
                                <Icon name="layers" size={48} />
                            </div>
                            <h3 className="text-3xl font-black text-slate-800 mb-2 group-hover:text-indigo-700 transition-colors">الماسح الذكي (Smart Parser)</h3>
                            <p className="text-slate-400 font-bold text-lg">تحليل قائم على الوصف الوظيفي</p>
                            <div className="mt-8 px-6 py-3 bg-slate-50 rounded-full text-indigo-600 font-black text-sm group-hover:bg-indigo-600 group-hover:text-white transition-colors flex items-center gap-2">
                                ابدأ الفحص الآن <Icon name="arrow-left" size={16} />
                            </div>
                        </button>
                    </div>
                </div>
            );
        };

        const AdvancedScanner = ({ setView }) => {
            const [step, setStep] = useState(1); 
            const [jobDesc, setJobDesc] = useState('');
            const [files, setFiles] = useState([]);
            const [results, setResults] = useState([]);
            const [selectedResult, setSelectedResult] = useState(null); 
            const [isProcessing, setIsProcessing] = useState(false);
            const fileInputRef = useRef(null);
            
            const handleFileDrop = (e) => {
                e.preventDefault();
                const droppedFiles = Array.from(e.dataTransfer.files);
                addFiles(droppedFiles);
            };

            const handleFileSelect = (e) => {
                const selectedFiles = Array.from(e.target.files);
                addFiles(selectedFiles);
            };

            const addFiles = (newFiles) => {
                const validFiles = newFiles.filter(f => 
                    ['application/pdf', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'text/plain'].includes(f.type)
                );
                setFiles(prev => [...prev, ...validFiles]);
            };

            const removeFile = (idx) => {
                setFiles(files.filter((_, i) => i !== idx));
            };

            const runBulkAnalysis = async () => {
                if (!jobDesc || files.length === 0) return alert('يرجى إدخال الوصف الوظيفي ورفع السير الذاتية');
                setStep(2);
                setIsProcessing(true);

                try {
                    const analysisResults = [];
                    
                    for (const file of files) {
                        // 1. Extract real text
                        const text = await extractTextFromFile(file);
                        
                        // 2. Run analysis logic (Keyword based only)
                        const analysis = analyzeCV(text, jobDesc);

                        analysisResults.push({
                            id: Date.now() + Math.random(),
                            fileName: file.name,
                            candidateName: file.name.split('.')[0].replace(/[-_]/g, ' '),
                            ...analysis,
                            fullTextSnippet: text.slice(0, 200) + "..." // For debug/preview
                        });
                    }

                    // Sort by score
                    analysisResults.sort((a, b) => b.score - a.score);
                    setResults(analysisResults);
                    setStep(3);
                } catch (error) {
                    console.error("Analysis Failed", error);
                    alert("حدث خطأ أثناء قراءة الملفات. يرجى التأكد من أن الملفات سليمة.");
                    setStep(1);
                } finally {
                    setIsProcessing(false);
                }
            };

            return (
                <div className="max-w-7xl mx-auto pt-6 px-4 pb-20 animate-fade-in h-full">
                    {/* Header */}
                    <div className="flex items-center justify-between mb-8">
                        <div className="flex items-center gap-4">
                            <button onClick={() => setView('home')} className="p-3 bg-white rounded-xl shadow-sm hover:shadow-md transition-all text-slate-500 hover:text-indigo-600">
                                <Icon name="arrow-right" size={24} />
                            </button>
                            <div>
                                <h2 className="text-3xl font-black text-slate-800">الماسح الفعلي (Real Engine)</h2>
                                <p className="text-slate-500 text-sm font-bold">تحليل مبني على الكلمات المفتاحية في الوصف الوظيفي</p>
                            </div>
                        </div>
                        {step === 3 && (
                            <button onClick={() => {setStep(1); setFiles([]); setResults([]);}} className="px-6 py-3 bg-indigo-50 text-indigo-600 rounded-xl font-black hover:bg-indigo-100 transition-colors flex items-center gap-2">
                                <Icon name="plus" size={18} /> فحص جديد
                            </button>
                        )}
                    </div>

                    {/* Step 1: Input & Upload */}
                    {step === 1 && (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-fade-in">
                            <div className="lg:col-span-5 space-y-6">
                                <div className="bg-white p-8 rounded-[35px] shadow-sm border border-slate-100">
                                    <label className="flex items-center gap-2 font-black text-slate-700 mb-4">
                                        <div className="p-2 bg-indigo-50 text-indigo-600 rounded-lg"><Icon name="briefcase" size={18} /></div>
                                        1. الكلمات المفتاحية / الوصف الوظيفي
                                    </label>
                                    <textarea 
                                        className="w-full h-64 p-4 bg-slate-50 rounded-2xl border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none resize-none text-sm font-medium transition-all leading-relaxed"
                                        placeholder="اكتب المهارات المطلوبة بوضوح (مثال: React JavaScript Python Communication)... النظام سيبحث عن هذه الكلمات بدقة داخل الملفات."
                                        value={jobDesc}
                                        onChange={(e) => setJobDesc(e.target.value)}
                                    ></textarea>
                                </div>
                            </div>

                            <div className="lg:col-span-7 space-y-6">
                                <div className="bg-white p-8 rounded-[35px] shadow-sm border border-slate-100 h-full flex flex-col">
                                    <label className="flex items-center justify-between font-black text-slate-700 mb-4">
                                        <div className="flex items-center gap-2">
                                            <div className="p-2 bg-violet-50 text-violet-600 rounded-lg"><Icon name="files" size={18} /></div>
                                            2. رفع السير الذاتية (Real Parsing)
                                        </div>
                                        <span className="text-xs bg-slate-100 px-2 py-1 rounded text-slate-500">{files.length} ملفات</span>
                                    </label>
                                    
                                    <div 
                                        className="file-drop-zone flex-1 min-h-[200px] rounded-[24px] flex flex-col items-center justify-center cursor-pointer relative p-6"
                                        onDragOver={(e) => e.preventDefault()}
                                        onDrop={handleFileDrop}
                                        onClick={() => fileInputRef.current.click()}
                                    >
                                        <input type="file" ref={fileInputRef} onChange={handleFileSelect} className="hidden" multiple accept=".pdf,.doc,.docx,.txt" />
                                        
                                        {files.length > 0 ? (
                                            <div className="w-full grid grid-cols-2 md:grid-cols-3 gap-3 max-h-[300px] overflow-y-auto p-2" onClick={(e) => e.stopPropagation()}>
                                                {files.map((f, i) => (
                                                    <div key={i} className="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between group animate-fade-in">
                                                        <div className="flex items-center gap-2 overflow-hidden">
                                                            <div className="w-8 h-8 bg-slate-50 rounded-lg flex items-center justify-center text-slate-400 shrink-0"><Icon name="file" size={14}/></div>
                                                            <span className="text-xs font-bold text-slate-600 truncate">{f.name}</span>
                                                        </div>
                                                        <button onClick={() => removeFile(i)} className="text-slate-300 hover:text-rose-500 p-1"><Icon name="x" size={14}/></button>
                                                    </div>
                                                ))}
                                                <div className="flex flex-col items-center justify-center p-3 border-2 border-dashed border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50" onClick={() => fileInputRef.current.click()}>
                                                    <Icon name="plus" size={20} className="text-slate-400"/>
                                                    <span className="text-[10px] text-slate-400 font-bold">إضافة</span>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="text-center p-6">
                                                <div className="w-16 h-16 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3">
                                                    <Icon name="upload-cloud" size={32} />
                                                </div>
                                                <p className="font-bold text-slate-600 text-sm">اسحب الملفات هنا (PDF, DOCX)</p>
                                                <p className="text-[10px] text-slate-400 mt-2">سنقوم باستخراج النصوص فعلياً</p>
                                            </div>
                                        )}
                                    </div>
                                    
                                    <button 
                                        onClick={runBulkAnalysis}
                                        disabled={files.length === 0 || !jobDesc}
                                        className="w-full py-5 mt-6 bg-slate-900 text-white rounded-[24px] font-black text-lg shadow-xl hover:shadow-2xl hover:bg-indigo-600 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3"
                                    >
                                        <Icon name="sparkles" className="text-yellow-400" /> تحليل حقيقي (بدون محاكاة)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Step 2: Loading */}
                    {step === 2 && (
                        <div className="h-[60vh] flex flex-col items-center justify-center bg-white rounded-[40px] shadow-xl border border-slate-100 p-10">
                            <div className="relative w-40 h-40 mb-8">
                                <div className="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
                                <div className="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
                                <div className="absolute inset-0 flex items-center justify-center flex-col">
                                    <Icon name="file-search" size={40} className="text-indigo-600 mb-1 animate-pulse" />
                                </div>
                            </div>
                            <h3 className="text-2xl font-black text-slate-800 mb-2">جاري قراءة الملفات...</h3>
                            <p className="text-slate-500 text-sm">نقوم الآن بفتح الملفات واستخراج النصوص ومطابقتها مع الوصف الوظيفي.</p>
                        </div>
                    )}

                    {/* Step 3: Results */}
                    {step === 3 && (
                        <div className="animate-fade-in space-y-8">
                            <div className="bg-white rounded-[40px] shadow-xl border border-slate-100 overflow-hidden">
                                <div className="p-8 border-b border-slate-100 flex justify-between items-center">
                                    <h3 className="text-xl font-black text-slate-800">النتائج الفعلية</h3>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-right">
                                        <thead className="bg-slate-50 text-slate-500 text-xs font-black uppercase">
                                            <tr>
                                                <th className="px-6 py-5 text-center w-16">#</th>
                                                <th className="px-6 py-5">المرشح</th>
                                                <th className="px-6 py-5">التوافق (كلمات مفتاحية)</th>
                                                <th className="px-6 py-5 text-center">الإجراء</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {results.map((res, idx) => (
                                                <tr key={res.id} className="hover:bg-slate-50/50 transition-colors group">
                                                    <td className="px-6 py-5 text-center">
                                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black text-sm ${idx === 0 ? 'bg-yellow-100 text-yellow-600' : 'text-slate-400'}`}>
                                                            {idx + 1}
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-5">
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-sm">
                                                                {res.candidateName.slice(0,2).toUpperCase()}
                                                            </div>
                                                            <div>
                                                                <div className="font-black text-slate-800 text-sm">{res.candidateName}</div>
                                                                <div className="text-xs text-slate-400">{res.email}</div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-5">
                                                        <div className="flex items-center gap-3">
                                                            <div className="flex-1 w-24 bg-slate-100 rounded-full h-2">
                                                                <div className={`h-2 rounded-full ${res.score >= 75 ? 'bg-emerald-500' : res.score >= 50 ? 'bg-amber-500' : 'bg-rose-500'}`} style={{width: `${res.score}%`}}></div>
                                                            </div>
                                                            <span className="font-black text-sm">{res.score}%</span>
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-5 text-center">
                                                        <button 
                                                            onClick={() => setSelectedResult(res)}
                                                            className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all"
                                                        >
                                                            التقرير
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Detailed Analysis Modal */}
                    {selectedResult && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in" onClick={() => setSelectedResult(null)}>
                            <div className="bg-slate-50 w-full max-w-5xl max-h-[90vh] overflow-y-auto rounded-[35px] shadow-2xl border border-slate-200 flex flex-col" onClick={e => e.stopPropagation()}>
                                {/* Header */}
                                <div className="bg-white p-8 border-b border-slate-100 flex justify-between items-start rounded-t-[35px]">
                                    <div className="flex gap-4">
                                        <div className="w-16 h-16 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-2xl font-black shadow-lg shadow-indigo-200">
                                            {selectedResult.candidateName.slice(0,2).toUpperCase()}
                                        </div>
                                        <div>
                                            <h3 className="text-2xl font-black text-slate-800">{selectedResult.candidateName}</h3>
                                            <div className="flex items-center gap-3 mt-1 text-slate-500 text-sm">
                                                <span className="flex items-center gap-1"><Icon name="mail" size={14}/> {selectedResult.email}</span>
                                                <span className="flex items-center gap-1"><Icon name="phone" size={14}/> {selectedResult.phone}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex flex-col items-end">
                                        <div className={`text-5xl font-black ${selectedResult.score >= 75 ? 'text-emerald-500' : 'text-amber-500'}`}>{selectedResult.score}%</div>
                                        <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">التوافق مع الوصف</span>
                                    </div>
                                </div>
                                
                                {/* Body */}
                                <div className="p-8 overflow-y-auto custom-scrollbar">
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                        {/* Left Column: Stats */}
                                        <div className="space-y-6">
                                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                                <h4 className="font-black text-slate-800 mb-4 flex items-center gap-2"><Icon name="bar-chart-2" size={18} className="text-indigo-600"/> تفاصيل المطابقة</h4>
                                                <div className="space-y-4">
                                                    <div>
                                                        <div className="text-xs text-slate-500 font-bold mb-1">الكلمات المفتاحية الموجودة</div>
                                                        <div className="text-2xl font-black text-emerald-600">{selectedResult.foundKeywords.length} كلمة</div>
                                                    </div>
                                                    <div>
                                                        <div className="text-xs text-slate-500 font-bold mb-1">الكلمات المفقودة</div>
                                                        <div className="text-2xl font-black text-rose-600">{selectedResult.missingKeywords.length} كلمة</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Right Column: Details */}
                                        <div className="lg:col-span-2 space-y-6">
                                            {/* AI Summary */}
                                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                                <div className="flex items-center gap-2 mb-3">
                                                    <Icon name="file-text" className="text-indigo-600" />
                                                    <h4 className="font-black text-slate-800">تقرير التحليل الآلي</h4>
                                                </div>
                                                <p className="text-slate-600 leading-relaxed font-medium">
                                                    {selectedResult.aiSummary}
                                                </p>
                                                <div className="mt-4 pt-4 border-t border-slate-100 text-xs text-slate-400">
                                                    * تم استخراج هذا التقرير بناءً على مطابقة النص الفعلي.
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                {/* Found Keywords */}
                                                <div className="bg-emerald-50/50 p-6 rounded-3xl border border-emerald-100">
                                                    <h4 className="font-black text-emerald-800 mb-4 flex items-center gap-2"><Icon name="check" size={18}/> كلمات تم إيجادها</h4>
                                                    <div className="flex flex-wrap gap-2">
                                                        {selectedResult.foundKeywords.length > 0 ? selectedResult.foundKeywords.map((k, i) => (
                                                            <span key={i} className="px-2 py-1 bg-white text-emerald-700 rounded-lg text-xs font-bold border border-emerald-100">{k}</span>
                                                        )) : <span className="text-xs text-emerald-600">لا يوجد</span>}
                                                    </div>
                                                </div>

                                                {/* Missing Keywords */}
                                                <div className="bg-rose-50/50 p-6 rounded-3xl border border-rose-100">
                                                    <h4 className="font-black text-rose-800 mb-4 flex items-center gap-2"><Icon name="x" size={18}/> كلمات مفقودة</h4>
                                                    <div className="flex flex-wrap gap-2">
                                                        {selectedResult.missingKeywords.length > 0 ? selectedResult.missingKeywords.map((k, i) => (
                                                            <span key={i} className="px-2 py-1 bg-white text-rose-700 rounded-lg text-xs font-bold border border-rose-100">{k}</span>
                                                        )) : <span className="text-xs text-rose-600">لا يوجد (تطابق كامل)</span>}
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            {/* Snippet Preview */}
                                            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                                <h5 className="text-xs font-black text-slate-400 mb-2 uppercase">مقتطف من النص المستخرج (للتحقق)</h5>
                                                <p className="text-xs text-slate-500 font-mono leading-relaxed opacity-70">
                                                    {selectedResult.fullTextSnippet}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home');

            return (
                <div className="min-h-screen">
                    <nav className="p-6 flex justify-between items-center max-w-7xl mx-auto">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('home')}>
                            <div className="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white shadow-lg">
                                <Icon name="aperture" size={24} />
                            </div>
                            <span className="font-black text-xl text-slate-800">Omar ATS</span>
                        </div>
                        <div className="flex items-center gap-4">
                            <button className="hidden md:flex items-center gap-2 px-4 py-2 bg-white rounded-full text-xs font-bold text-slate-600 shadow-sm border border-slate-100 hover:border-indigo-200 transition-colors">
                                <Icon name="help-circle" size={16} /> مساعدة
                            </button>
                            <div className="w-10 h-10 rounded-full bg-indigo-100 border-2 border-white shadow-md flex items-center justify-center text-indigo-700 font-black">
                                HR
                            </div>
                        </div>
                    </nav>

                    <main>
                        {view === 'home' && <DashboardHome setView={setView} />}
                        {view === 'scanner' && <AdvancedScanner setView={setView} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
